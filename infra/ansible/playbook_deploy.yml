---
- name: Deploy arturscibor_backend
  hosts: production
  become: true
  vars_files:
    - secrets.yml
  vars:
    ansible_become_pass: "{{ become_password }}"
    repo_url: "https://github.com/1ChaLLengeR1/arturscibor-server-FastAPI.git"
    repo_dest: /opt/arturscibor_backend
    doppler_project: arturscibor_backend
    doppler_config: prd
    # Normally passed by run_production.yml as -e backend_image_override=...
    # (the tag CI just built+pushed). Falls back to :latest instead of hard
    # failing — matches project-job-server-FastAPI's own playbook exactly;
    # their CD had the same `mandatory()`-style gap once and it turned out
    # GitHub doesn't always thread a chained reusable workflow's output
    # through this cleanly, so this stays permissive on purpose. Assumes the
    # `REPOSITORY` GitHub secret is "arturscibor_backend" (matches every
    # other naming decision in this repo) — only matters for this fallback
    # path, the real deploy always uses the actual passed-in tag when present.
    backend_image: "{{ backend_image_override | default(docker_hub_username ~ '/arturscibor_backend:latest') }}"
  tasks:
    - import_tasks: tasks/checkout.yml
    - import_tasks: tasks/networks.yml
    - import_tasks: tasks/secret_env.yml
    - import_tasks: tasks/deploy.yml
    - import_tasks: tasks/cleanup.yml
