---
- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ docker_hub_username }}"
    password: "{{ docker_hub_password }}"
  no_log: true

- name: Deploy Traefik stack
  ansible.builtin.command:
    cmd: docker stack deploy -c infra/compose/traefik_production_stack.yaml arturscibor_traefik
    chdir: "{{ repo_dest }}"
  changed_when: true

- name: Deploy backend stack
  ansible.builtin.command:
    cmd: docker stack deploy --with-registry-auth -c infra/compose/production.swarm.docker-compose.yaml arturscibor
    chdir: "{{ repo_dest }}"
  environment:
    BACKEND_IMAGE: "{{ backend_image }}"
    ENV_SECRET_VERSION: "{{ env_hash }}"
  changed_when: true
