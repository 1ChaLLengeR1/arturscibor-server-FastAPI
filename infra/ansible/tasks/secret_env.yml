---
# Pulls the app's env bundle from Doppler and publishes it as a
# content-hashed docker secret — same name -> Swarm skips restarting
# services that don't actually need it; changed content -> new secret name
# -> services referencing it get redeployed automatically.
#
# NOTE: not yet verified against a real Doppler project/Swarm cluster (no
# infra to test against at scaffolding time). Known open question before
# first real deploy: Doppler bundle must use the app's prefixed key names
# (ARTURSCIBOR_BACKEND_DB_USER, ARTURSCIBOR_BACKEND_DB_PASSWORD,
# ARTURSCIBOR_BACKEND_DB_NAME, ... — see config/settings.py's env_prefix)
# — the postgres service entrypoint in production.swarm.docker-compose.yaml
# re-maps those to POSTGRES_* itself, so no duplication needed in Doppler,
# but this mapping is untested.

- name: Fetch app secrets from Doppler
  ansible.builtin.command:
    cmd: >
      doppler secrets download --no-file --format env
      --token {{ doppler_token }}
      --project {{ doppler_project }}
      --config {{ doppler_config }}
  register: doppler_env
  changed_when: false
  no_log: true

- name: Compute content hash of the env bundle
  ansible.builtin.set_fact:
    env_hash: "{{ doppler_env.stdout | hash('sha256') | truncate(12, True, '') }}"
  no_log: true

- name: Write env bundle to a temp file
  ansible.builtin.copy:
    content: "{{ doppler_env.stdout }}"
    dest: "/tmp/arturscibor_env_prod_{{ env_hash }}"
    mode: "0600"
  no_log: true

- name: Create content-hashed docker secret
  community.docker.docker_secret:
    name: "arturscibor_env_prod_{{ env_hash }}"
    file: "/tmp/arturscibor_env_prod_{{ env_hash }}"
    state: present

- name: Remove temp env file
  ansible.builtin.file:
    path: "/tmp/arturscibor_env_prod_{{ env_hash }}"
    state: absent

- name: Clean up old env secret versions
  ansible.builtin.shell:
    cmd: >
      docker secret ls --format '{{ "{{" }}.Name{{ "}}" }}' | grep '^arturscibor_env_prod_' |
      grep -v "arturscibor_env_prod_{{ env_hash }}" | xargs -r docker secret rm
  changed_when: true
  failed_when: false
