---
# Pulls the app's env bundle from Doppler and publishes it as a
# content-hashed docker secret — same name -> Swarm skips restarting
# services that don't actually need it; changed content -> new secret name
# -> services referencing it get redeployed automatically.
#
# NOTE: not yet verified against a real Doppler project/Swarm cluster (no
# infra to test against at scaffolding time). Doppler bundle must use the
# app's prefixed key names (ARTURSCIBOR_BACKEND_DB_USER,
# ARTURSCIBOR_BACKEND_DB_PASSWORD, ARTURSCIBOR_BACKEND_DB_NAME, ... — see
# config/settings.py's env_prefix), with ARTURSCIBOR_BACKEND_DB_HOST set to
# host.docker.internal (Postgres is native on the host, not a Swarm
# service — see production.swarm.docker-compose.yaml).

- name: Fetch app secrets from Doppler
  ansible.builtin.command:
    cmd: >
      doppler secrets download --no-file --format env
      --token {{ doppler_token }}
      --project {{ doppler_project }}
      --config {{ doppler_config }}
  register: doppler_env
  changed_when: false
  no_log: true

- name: Compute content hash of the env bundle
  ansible.builtin.set_fact:
    env_hash: "{{ doppler_env.stdout | hash('sha256') | truncate(12, True, '') }}"
  no_log: true

- name: Check whether the content-hashed docker secret already exists
  ansible.builtin.command:
    cmd: docker secret inspect arturscibor_env_prd_{{ env_hash }}
  register: secret_inspect
  failed_when: false
  changed_when: false
  no_log: true

- name: Create content-hashed docker secret
  # Plain `docker secret create ... -` (stdin), not community.docker — same
  # reasoning as tasks/networks.yml. Piped via stdin instead of a temp file
  # on disk, so the env bundle never touches the remote filesystem at all.
  ansible.builtin.command:
    cmd: docker secret create arturscibor_env_prd_{{ env_hash }} -
    stdin: "{{ doppler_env.stdout }}"
  when: secret_inspect.rc != 0
  no_log: true

- name: Clean up old env secret versions
  ansible.builtin.shell:
    cmd: >
      docker secret ls --format '{{ "{{" }}.Name{{ "}}" }}' | grep '^arturscibor_env_prd_' |
      grep -v "arturscibor_env_prd_{{ env_hash }}" | xargs -r docker secret rm
  changed_when: true
  failed_when: false
