[project]
name = "arturscibor-server-fastapi"
version = "0.1.0"
description = "Backend API for arturscibor.pl portfolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "python-decouple>=3.8",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Old flat layout (DataBase/JWT/routers) and new layered layout (api/core/
# config/database/infra) coexist during the migration described in
# docs/roadmap.md — both are listed so packaging keeps working either way.
include = ["DataBase*", "JWT*", "routers*", "api*", "core*", "config*", "database*", "infra*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]
