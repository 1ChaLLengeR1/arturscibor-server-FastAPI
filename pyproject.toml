[project]
name = "arturscibor-server-fastapi"
version = "0.1.0"
description = "Backend API for arturscibor.pl portfolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.4",
    "python-decouple>=3.8",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# routers/ still exists on disk (not-yet-migrated domains, unplugged from
# main.py) alongside the new layered layout (api/core/config/database/infra)
# — see docs/roadmap.md. DataBase/ and JWT/ are gone, fully replaced.
include = ["routers*", "api*", "core*", "config*", "database*", "infra*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Matches the ARCHITEKTURA.md-documented filename (api/middleware/Authentication.py)
"api/middleware/Authentication.py" = ["N999"]
